# Symlinked to ~/.tmux.conf by install.sh.
# Tuned for a remote Coder workspace reached over SSH, not a local terminal.

# screen-256color rather than tmux-256color: the latter is missing from the
# terminfo database on minimal container images and on older macOS ncurses,
# and tmux fails to start when default-terminal names a missing entry.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# OSC-52. This is what makes a tmux copy inside the workspace land in the
# clipboard on the Mac you are sshing from.
set -g set-clipboard on

set -g mouse on
set -g history-limit 50000
set -g focus-events on

# 500ms is the default and it makes vim's Esc feel broken over SSH; 10ms is
# still comfortably above real network jitter for an escape sequence.
set -sg escape-time 10

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix stays C-b on purpose. C-a collides with beginning-of-line in the shell,
# and C-t/C-r are taken by fzf's file and history widgets.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-position top
set -g status-style "bg=default fg=white"
set -g status-left "#[fg=cyan,bold] #S #[default]"
set -g status-right "#[fg=yellow]#h #[fg=white]%H:%M "
set -g status-left-length 40
setw -g window-status-current-style "fg=black bg=cyan"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
